<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MRI Validation - spike</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: sans-serif; }
      #wrap { height: 100%; display: flex; flex-direction: column; }
      #msg { padding: 6px 10px 0; font-size: 13px; }
      #tb { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 6px 10px; font-size: 13px; }
      #tb label { display: flex; align-items: center; gap: 6px; }
      #tb input[type=range] { width: 130px; }
      #tb output { min-width: 34px; text-align: right; color: #aaa; }
      button { background: #222; color: #ddd; border: 1px solid #555; border-radius: 6px; cursor: pointer; }
      button:hover { background: #333; }
      #cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 44px repeat(5, minmax(0, 1fr)); gap: 6px; padding: 0 6px 6px; }
      .col { display: flex; flex-direction: column; min-height: 0; }
      .col h2 { margin: 0 0 4px; font-size: 13px; font-weight: 500; text-align: center; }
      .col canvas { outline: none; flex: 1; min-height: 0; width: 100%; display: block; }
      #gutter { position: relative; flex: 1; min-height: 0; }
      .rowctl { position: absolute; left: 0; right: 0; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #aaa; }
      .rowctl button { width: 30px; height: 26px; padding: 0; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="msg">Carregando volumes...</div>
      <div id="tb">
        <label>Brilho <input type="range" id="br" min="-50" max="50" value="0" step="1" /><output id="brv">0</output></label>
        <label>Contraste <input type="range" id="ct" min="50" max="300" value="100" step="1" /><output id="ctv">100%</output></label>
        <button id="rs" style="height: 26px; padding: 0 10px">Restaurar</button>
        <span style="margin-left: auto; color: #888">Vale para todas as imagens</span>
      </div>
      <div id="cols"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
